<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{% block title %}Admin{% endblock %} — Khusboo Creatives</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--pink:#e91e8c;--purple:#7b2ff7;--dark:#0f0f1a;--sidebar:#13131f;--card:#1a1a2e;--text:#e0e0f0;--muted:#888aaa;--grad:linear-gradient(135deg,#e91e8c,#7b2ff7);--border:rgba(255,255,255,.07)}
    body{font-family:'Poppins',sans-serif;background:var(--dark);color:var(--text);display:flex;min-height:100vh}

    /* SIDEBAR */
    .sidebar{width:240px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.5rem 0;flex-shrink:0;position:fixed;height:100vh;overflow-y:auto}
    .sidebar-logo{padding:0 1.5rem 1.5rem;font-size:1.1rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;border-bottom:1px solid var(--border);margin-bottom:1rem}
    .nav-section{padding:.3rem 1rem;font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:.5rem}
    .nav-link{display:flex;align-items:center;gap:.8rem;padding:.65rem 1.5rem;color:var(--muted);text-decoration:none;font-size:.9rem;transition:background .15s,color .15s;border-radius:0}
    .nav-link:hover,.nav-link.active{color:var(--text);background:rgba(255,255,255,.05)}
    .nav-link.active{border-right:3px solid var(--pink)}
    .nav-icon{font-size:1.1rem;width:22px;text-align:center}
    .sidebar-footer{margin-top:auto;padding:1rem 1.5rem;border-top:1px solid var(--border)}
    .logout-btn{display:block;text-align:center;color:var(--muted);font-size:.85rem;text-decoration:none;padding:.5rem;border-radius:8px;transition:background .15s,color .15s}
    .logout-btn:hover{background:rgba(255,82,82,.1);color:#ff5252}

    /* MAIN */
    .main{margin-left:240px;flex:1;padding:2rem;max-width:1200px}
    .page-header{margin-bottom:2rem}
    .page-title{font-size:1.8rem;font-weight:700}
    .page-title span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .page-sub{color:var(--muted);font-size:.9rem;margin-top:.3rem}

    /* CARDS */
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem}
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem}
    .stat-label{color:var(--muted);font-size:.75rem;font-weight:500;margin-bottom:.3rem}
    .stat-val{font-size:1.9rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

    /* TABLE */
    .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
    table{width:100%;border-collapse:collapse}
    thead{background:rgba(255,255,255,.04)}
    th{padding:.9rem 1.1rem;text-align:left;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
    td{padding:.85rem 1.1rem;font-size:.87rem;border-top:1px solid var(--border);vertical-align:middle}
    tr:hover td{background:rgba(255,255,255,.02)}

    /* BADGES */
    .badge{display:inline-block;border-radius:6px;padding:.18rem .55rem;font-size:.73rem;font-weight:600}
    .badge-new{background:rgba(0,200,255,.12);color:#00c8ff}
    .badge-contacted{background:rgba(255,200,0,.12);color:#ffc800}
    .badge-converted{background:rgba(0,230,118,.12);color:#00e676}
    .badge-lost{background:rgba(255,82,82,.12);color:#ff5252}
    .badge-service{background:rgba(233,30,140,.12);color:#e91e8c}
    .badge-budget{background:rgba(123,47,247,.15);color:#a78bfa}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:8px;font-size:.85rem;font-weight:500;border:none;cursor:pointer;text-decoration:none;transition:opacity .2s}
    .btn:hover{opacity:.8}
    .btn-grad{background:var(--grad);color:#fff}
    .btn-ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--border)}
    .btn-danger{background:rgba(255,82,82,.12);color:#ff5252;border:1px solid rgba(255,82,82,.2)}
    .btn-sm{padding:.3rem .7rem;font-size:.78rem}

    /* FORM */
    .form-group{margin-bottom:1.2rem}
    label{display:block;font-size:.85rem;font-weight:500;color:var(--muted);margin-bottom:.4rem}
    input[type=text],input[type=email],input[type=password],input[type=tel],textarea,select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:.65rem .9rem;color:#fff;font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}
    input:focus,textarea:focus,select:focus{border-color:var(--pink)}
    input::placeholder,textarea::placeholder{color:var(--muted)}
    textarea{resize:vertical;min-height:80px}
    .form-section{border:1px solid var(--border);border-radius:14px;padding:1.5rem;margin-bottom:1.5rem}
    .form-section-title{font-weight:600;font-size:1rem;margin-bottom:1.2rem;padding-bottom:.8rem;border-bottom:1px solid var(--border)}
    .alert{padding:.75rem 1rem;border-radius:10px;font-size:.88rem;margin-bottom:1.2rem}
    .alert-success{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:#00e676}
    .alert-error{background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.3);color:#ff5252}

    /* FILTERS */
    .filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.2rem}
    .filter-btn{padding:.4rem .9rem;border-radius:50px;font-size:.82rem;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;text-decoration:none;transition:all .15s}
    .filter-btn:hover,.filter-btn.active{background:var(--grad);border-color:transparent;color:#fff}

    /* WA button */
    .wa-btn{display:inline-flex;align-items:center;gap:.3rem;background:rgba(37,211,102,.12);color:#25d166;border:1px solid rgba(37,211,102,.25);border-radius:6px;padding:.25rem .6rem;font-size:.75rem;text-decoration:none;transition:opacity .15s}
    .wa-btn:hover{opacity:.8}

    @media(max-width:768px){.sidebar{display:none}.main{margin-left:0}}
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">✨ Khusboo Creatives</div>
  <div class="nav-section">Manage</div>
  <a class="nav-link {% if request.endpoint=='admin_leads' %}active{% endif %}" href="/admin/leads">
    <span class="nav-icon">👥</span> Leads
  </a>
  <div class="nav-section">Configure</div>
  <a class="nav-link {% if request.endpoint=='admin_settings' %}active{% endif %}" href="/admin/settings">
    <span class="nav-icon">⚙️</span> Settings
  </a>
  <a class="nav-link" href="/" target="_blank">
    <span class="nav-icon">🌐</span> View Website
  </a>
  <div class="sidebar-footer">
    <div style="color:var(--muted);font-size:.8rem;margin-bottom:.5rem;text-align:center">
      👤 {{ session.get('admin_name', 'Admin') }} <span style="font-size:.7rem;opacity:.6">({{ session.get('admin_role','admin') }})</span>
    </div>
    <a class="logout-btn" href="/dashboard/logout">🚪 Logout</a>
  </div>
</div>

<div class="main">
  {% block content %}{% endblock %}
</div>

</body>
</html>
