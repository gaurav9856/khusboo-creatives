<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin Login — Khusboo Creatives</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--pink:#e91e8c;--purple:#7b2ff7;--dark:#0f0f1a;--card:#1a1a2e;--text:#e0e0f0;--muted:#888aaa;--grad:linear-gradient(135deg,#e91e8c,#7b2ff7)}
    body{font-family:'Poppins',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:2.5rem;width:100%;max-width:380px;text-align:center}
    .logo{font-size:1.3rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1.5rem}
    .icon{font-size:3rem;margin-bottom:1rem}
    h2{font-size:1.5rem;font-weight:700;margin-bottom:.4rem}
    p{color:var(--muted);font-size:.9rem;margin-bottom:1.8rem}
    .error{background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.3);color:#ff5252;border-radius:10px;padding:.6rem 1rem;font-size:.85rem;margin-bottom:1rem}
    input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:.75rem 1rem;color:#fff;font-size:.95rem;font-family:inherit;outline:none;margin-bottom:1rem;transition:border-color .2s}
    input:focus{border-color:var(--pink)}
    input::placeholder{color:var(--muted)}
    button{width:100%;background:var(--grad);color:#fff;border:none;padding:.85rem;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s}
    button:hover{opacity:.85}
    .back{display:block;margin-top:1.2rem;color:var(--muted);font-size:.85rem;text-decoration:none}
    .back:hover{color:var(--text)}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">✨ Khusboo Creatives</div>
  <div class="icon">🔐</div>
  <h2>Admin Login</h2>
  <p>Enter your password to manage leads and settings</p>
  {% if error %}<div class="error">Wrong password. Please try again.</div>{% endif %}
  <form method="POST">
    <input type="text" name="username" placeholder="Your name (e.g. Khusboo)" autofocus/>
    <input type="password" name="password" placeholder="Enter your password"/>
    <button type="submit">Login →</button>
  </form>
  <a class="back" href="/">← Back to website</a>
</div>
</body>
</html>
